<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Дз№1</title>
</head>
<body>

<script>
    // 1. 
let start = Number(prompt("Початок діапазону:"));
let end = Number(prompt("Кінець діапазону:"));
let sum = 0;

for (let i = start; i <= end; i++) {
    sum += i;
}

alert("Сума: " + sum);


// 2. 
let a = Number(prompt("Введіть перше число:"));
let b = Number(prompt("Введіть друге число:"));

while (a !== b) {
    if (a > b) {
        a -= b;
    } else {
        b -= a;
    }
}

alert("НСД: " + a);


// 3. 
let num = Number(prompt("Введіть число:"));
let result = "";

for (let i = 1; i <= num; i++) {
    if (num % i === 0) {
        result += i + " ";
    }
}

alert(result);


// 4. 
let number = Number(prompt("Введіть число:"));
let count = 0;

do {
    count++;
    number = Math.floor(number / 10);
} while (number > 0);

alert("Кількість цифр: " + count);


// 5. 
let positive = 0;
let negative = 0;
let zeros = 0;
let even = 0;
let odd = 0;

for (let i = 1; i <= 10; i++) {
    let n = Number(prompt("Введіть число №" + i));

    if (n > 0) positive++;
    else if (n < 0) negative++;
    else zeros++;

    if (n % 2 === 0) even++;
    else odd++;
}

alert(
    "Додатних: " + positive +
    "\nВід'ємних: " + negative +
    "\nНулів: " + zeros +
    "\nПарних: " + even +
    "\nНепарних: " + odd
);


// 6. 
let again;

do {
    let x = Number(prompt("Перше число:"));
    let y = Number(prompt("Друге число:"));
    let sign = prompt("Знак (+ - * /):");
    let answer;

    switch (sign) {
        case "+":
            answer = x + y;
            break;
        case "-":
            answer = x - y;
            break;
        case "*":
            answer = x * y;
            break;
        case "/":
            answer = x / y;
            break;
    }

    alert("Результат: " + answer);

    again = confirm("Бажаєте ще один приклад?");
}
while (again);


// 7. 
let value = prompt("Введіть число:");
let shift = Number(prompt("На скільки цифр змістити?"));

shift %= value.length;

let moved =
    value.slice(shift) +
    value.slice(0, shift);

alert(moved);


// 8. 
let days = [
    "Понеділок",
    "Вівторок",
    "Середа",
    "Четвер",
    "П'ятниця",
    "Субота",
    "Неділя"
];

let dayIndex = 0;

while (
    confirm(days[dayIndex] +
    ". Бажаєте побачити наступний день?")
) {
    dayIndex++;
    if (dayIndex === days.length) {
        dayIndex = 0;
    }
}


// 9.
let table = "";

for (let i = 2; i <= 9; i++) {
    for (let j = 1; j <= 10; j++) {
        table += i + " × " + j + " = " + (i * j) + "\n";
    }
    table += "\n";
}

alert(table);


// 10. 
let min = 0;
let max = 100;

while (true) {
    let mid = Math.floor((min + max) / 2);

    let answer = prompt(
        "Ваше число > " + mid +
        ", < " + mid +
        " або == " + mid + " ?"
    );

    if (answer === "==") {
        alert("Ваше число: " + mid);
        break;
    }
    else if (answer === ">") {
        min = mid + 1;
    }
    else if (answer === "<") {
        max = mid - 1;
    }
}
</script>

</body>
</html>
