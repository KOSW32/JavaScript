<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Random Dog</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    padding: 40px;
    text-align: center;
  }
  button {
    padding: 12px 24px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #4a76a8;
    color: #fff;
  }
  button:disabled {
    background: #aaa;
    cursor: not-allowed;
  }
  #message {
    margin-top: 20px;
    font-size: 16px;
  }
  #error {
    margin-top: 20px;
    font-size: 16px;
    color: red;
  }
  #imageContainer {
    margin-top: 20px;
  }
  #dogImage {
    max-width: 400px;
    max-height: 400px;
    border-radius: 8px;
    display: none;
  }
</style>
</head>
<body>

<button id="fetchBtn">Показати випадкового собаку</button>

<div id="message"></div>
<div id="error"></div>

<div id="imageContainer">
  <img id="dogImage" src="" alt="Random dog">
</div>

<script>
const fetchBtn = document.getElementById('fetchBtn');
const messageEl = document.getElementById('message');
const errorEl = document.getElementById('error');
const dogImage = document.getElementById('dogImage');

async function fetchDog() {
  fetchBtn.disabled = true;
  messageEl.textContent = 'Шукаємо хвостика...';
  errorEl.textContent = '';
  dogImage.style.display = 'none';

  try {
    const response = await fetch('https://dog.ceo/api/breeds/image/random');

    if (!response.ok) {
      throw new Error('Server error');
    }

    const data = await response.json();

    dogImage.src = data.message;
    dogImage.style.display = 'inline-block';
    messageEl.textContent = '';
  } catch (err) {
    errorEl.textContent = 'Не вдалося завантажити фото. Спробуйте ще раз';
    messageEl.textContent = '';
  } finally {
    fetchBtn.disabled = false;
  }
}

fetchBtn.addEventListener('click', fetchDog);
</script>

</body>
</html>
