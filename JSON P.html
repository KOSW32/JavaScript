<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>JSON Formatter</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5efe6;
    padding: 30px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  h2 {
    margin-bottom: 20px;
  }
  .panels {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .panel {
    flex: 1;
  }
  .panel-header {
    font-weight: bold;
    margin-bottom: 5px;
  }
  .error-label {
    color: red;
    margin-left: 10px;
    font-weight: normal;
  }
  textarea, .output-box {
    width: 100%;
    height: 300px;
    box-sizing: border-box;
    padding: 10px;
    font-family: monospace;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    overflow: auto;
    white-space: pre;
    resize: vertical;
  }
  .btn-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  button {
    padding: 10px 14px;
    font-size: 16px;
    cursor: pointer;
    border: 1px solid #999;
    border-radius: 4px;
    background: #eee;
  }
  button:hover {
    background: #ddd;
  }
</style>
</head>
<body>
<div class="container">
  <h2>JSON Formatter</h2>
  <div class="panels">
    <div class="panel">
      <div class="panel-header">
        Enter JSON data:
        <span class="error-label" id="errorLabel"></span>
      </div>
      <textarea id="inputArea" placeholder='[{"id":1,"name":"Nick","age":33}, ...]'></textarea>
    </div>

    <div class="btn-wrap">
      <button id="formatBtn">&#9654;</button>
    </div>

    <div class="panel">
      <div class="panel-header">Formatted JSON data:</div>
      <div class="output-box" id="outputBox"></div>
    </div>
  </div>
</div>

<script>
const inputArea = document.getElementById('inputArea');
const outputBox = document.getElementById('outputBox');
const errorLabel = document.getElementById('errorLabel');
const formatBtn = document.getElementById('formatBtn');

formatBtn.addEventListener('click', function() {
  const text = inputArea.value;
  errorLabel.textContent = '';
  outputBox.textContent = '';

  let data;
  try {
    data = JSON.parse(text);
  } catch (err) {
    errorLabel.textContent = '[format error]';
    return;
  }

  outputBox.textContent = JSON.stringify(data, null, 4);
});
</script>
</body>
</html>
