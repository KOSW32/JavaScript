<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>дз№3</title>
</head>
<body>

<h2>Результаты в консоли (F12)</h2>

<script>

//1



let car = {
    manufacturer: "Toyota",
    model: "Camry",
    year: 2020,
    avgSpeed: 90,

    showInfo: function () {
        console.log("Автомобиль:");
        console.log(this.manufacturer, this.model, this.year, this.avgSpeed + " км/ч");
    },

    getTime: function (distance) {
        let time = distance / this.avgSpeed;

        // каждые 4 часа + 1 час отдыха
        let breaks = Math.floor(time / 4);

        return time + breaks;
    }
};

car.showInfo();
console.log("Время поездки (450 км):", car.getTime(450), "ч");


//2


function Fraction(n, d) {
    this.n = n;
    this.d = d;

    this.simplify = function () {
        function gcd(a, b) {
            while (b !== 0) {
                let t = b;
                b = a % b;
                a = t;
            }
            return a;
        }

        let g = gcd(this.n, this.d);
        this.n /= g;
        this.d /= g;
    };

    this.print = function () {
        console.log(this.n + "/" + this.d);
    };
}

function add(a, b) {
    return new Fraction(
        a.n * b.d + b.n * a.d,
        a.d * b.d
    );
}

function sub(a, b) {
    return new Fraction(
        a.n * b.d - b.n * a.d,
        a.d * b.d
    );
}

function mul(a, b) {
    return new Fraction(
        a.n * b.n,
        a.d * b.d
    );
}

function div(a, b) {
    return new Fraction(
        a.n * b.d,
        a.d * b.n
    );
}

// пример
let f1 = new Fraction(1, 2);
let f2 = new Fraction(1, 3);

let r = add(f1, f2);
r.simplify();
r.print();



// 3

let time = {
    hours: 20,
    minutes: 30,
    seconds: 45,

    show: function () {
        console.log(
            this.hours + ":" +
            this.minutes + ":" +
            this.seconds
        );
    },

    addSeconds: function (sec) {
        this.seconds += sec;

        this.minutes += Math.floor(this.seconds / 60);
        this.seconds = this.seconds % 60;

        this.hours += Math.floor(this.minutes / 60);
        this.minutes = this.minutes % 60;

        this.hours = this.hours % 24;
    },

    addMinutes: function (min) {
        this.addSeconds(min * 60);
    },

    addHours: function (h) {
        this.hours = (this.hours + h) % 24;
    }
};

time.show();
time.addSeconds(30);
time.show();
time.addMinutes(10);
time.show();

</script>

</body>
</html>
