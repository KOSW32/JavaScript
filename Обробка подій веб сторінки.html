<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Обробка подій веб сторінки</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:20px;
}

h2{
    margin-top:40px;
}

input{
    padding:8px;
    width:300px;
    font-size:16px;
}

button{
    padding:8px 15px;
    cursor:pointer;
}

hr{
    margin:40px 0;
}

/* Завдання 2 */

#modal{
    display:none;
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
}

.window{
    width:350px;
    background:#fff;
    margin:180px auto;
    padding:20px;
    text-align:center;
    border-radius:10px;
}

/* Завдання 3 */

#field{
    width:1000px;
    height:500px;
    margin:20px auto;
    position:relative;
    overflow:hidden;
    border:4px solid white;

    background:
    repeating-linear-gradient(
        90deg,
        #3d9b3d 0px,
        #3d9b3d 80px,
        #4caf50 80px,
        #4caf50 160px
    );
}

#field::before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    width:3px;
    height:100%;
    background:white;
    transform:translateX(-50%);
}

#center{
    width:120px;
    height:120px;
    border:3px solid white;
    border-radius:50%;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

#left{
    position:absolute;
    left:0;
    top:150px;
    width:150px;
    height:200px;
    border:3px solid white;
}

#right{
    position:absolute;
    right:0;
    top:150px;
    width:150px;
    height:200px;
    border:3px solid white;
}

#ball{
    width:60px;
    height:60px;
    position:absolute;
    left:470px;
    top:220px;
    transition:0.5s;
    user-select:none;
    pointer-events:none;
}
</style>
</head>

<body>

<h2>Завдання 1</h2>

<p>Enter your name (name can't contain digits):</p>

<input type="text" id="name">

<hr>

<h2>Завдання 2</h2>

<button id="open">Відкрити</button>

<div id="modal">
    <div class="window">
        <h3>Hello from Modal Window!</h3>
        <button id="close">Закрити</button>
    </div>
</div>

<hr>

<h2>Завдання 3</h2>

<div id="field">

<div id="center"></div>

<div id="left"></div>

<div id="right"></div>

<img id="ball" src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccerball.svg">


</div>

<script>
    // ================= Завдання 1 =================

let input = document.getElementById("name");

input.addEventListener("input", function () {
    this.value = this.value.replace(/[0-9]/g, "");
});


// ================= Завдання 2 =================

let modal = document.getElementById("modal");

document.getElementById("open").onclick = function () {
    modal.style.display = "block";
}

document.getElementById("close").onclick = function () {
    modal.style.display = "none";
}


// ================= Завдання 3 =================

let field = document.getElementById("field");
let ball = document.getElementById("ball");

field.onclick = function(event){

    let x = event.offsetX - ball.offsetWidth / 2;
    let y = event.offsetY - ball.offsetHeight / 2;

    if(x < 0){
        x = 0;
    }

    if(y < 0){
        y = 0;
    }

    if(x > field.clientWidth - ball.offsetWidth){
        x = field.clientWidth - ball.offsetWidth;
    }

    if(y > field.clientHeight - ball.offsetHeight){
        y = field.clientHeight - ball.offsetHeight;
    }

    ball.style.left = x + "px";
    ball.style.top = y + "px";
}
</script>

</body>
</html>
