<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoinGuard — облік фінансів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:        #16231D;
    --ink-soft:   #4D5C53;
    --paper:      #F1ECDD;
    --paper-line: #DAD2B8;
    --gold:       #B8892B;
    --gold-dark:  #8F6A1F;
    --income:     #3E7A55;
    --expense:    #A8482C;
    --card-bg:    #FFFFFF;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    padding:0 0 80px;
  }

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:0 24px;
  }

  /* ---------- Header ---------- */
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:32px 0 20px;
  }
  .brand svg{ flex:none; }
  .brand h1{
    font-family:'Fraunces', serif;
    font-size:1.5rem;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
  }

  /* ---------- Vault (balance block) ---------- */
  .vault{
    background:var(--ink);
    color:var(--paper);
    padding:32px 28px;
  }
  .vault .label{
    font-size:0.8rem;
    color:#C7CFC9;
    margin:0 0 6px;
  }
  .vault .balance{
    font-family:'Fraunces', serif;
    font-size:2.6rem;
    font-weight:600;
    margin:0 0 20px;
    line-height:1.1;
  }
  .vault .balance .cents{
    font-size:1.4rem;
    opacity:0.7;
  }
  .vault-stats{
    display:flex;
    gap:28px;
    border-top:1px solid #34443A;
    padding-top:16px;
    margin-bottom:18px;
  }
  .vault-stats div span{
    display:block;
  }
  .vault-stats .stat-label{
    font-size:0.72rem;
    color:#9FAAA2;
    margin-bottom:3px;
  }
  .vault-stats .stat-value{
    font-family:'IBM Plex Mono', monospace;
    font-size:1rem;
  }
  .stat-value.income{ color:#6FBE8C; }
  .stat-value.expense{ color:#E38264; }

  .convert-btn{
    background:transparent;
    border:1px solid #4A5B4F;
    color:var(--paper);
    padding:9px 16px;
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .convert-btn:hover{
    border-color:var(--gold);
    color:var(--gold);
  }
  .convert-btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
  }

  .convert-result{
    margin-top:14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    color:#D9CBA0;
    min-height:1.2em;
  }
  .convert-result.error{
    color:#E38264;
    font-family:'Inter', sans-serif;
  }

  /* ---------- New transaction form ---------- */
  .section-title{
    font-size:0.85rem;
    text-transform:none;
    color:var(--ink-soft);
    margin:32px 0 12px;
    font-weight:600;
  }

  .entry-form{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:flex-end;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .field label{
    font-size:0.72rem;
    color:var(--ink-soft);
  }
  .field input,
  .field select{
    font-family:'Inter', sans-serif;
    font-size:0.9rem;
    padding:9px 10px;
    border:1px solid var(--paper-line);
    background:var(--card-bg);
    color:var(--ink);
    border-radius:2px;
  }
  .field input:focus,
  .field select:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }
  .field-text{ flex:2 1 160px; }
  .field-amount{ flex:1 1 100px; }
  .field-type{ flex:1 1 110px; }

  .add-btn{
    background:var(--gold-dark);
    color:#fff;
    border:none;
    padding:10px 20px;
    font-family:'Inter', sans-serif;
    font-size:0.9rem;
    font-weight:500;
    cursor:pointer;
    border-radius:2px;
  }
  .add-btn:hover{
    background:var(--ink);
  }

  .form-error{
    margin-top:10px;
    font-size:0.82rem;
    color:var(--expense);
    min-height:1.1em;
  }

  /* ---------- Transaction list ---------- */
  .tx-list{
    margin-top:8px;
    border-top:1px solid var(--paper-line);
  }
  .tx-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 0;
    border-bottom:1px solid var(--paper-line);
  }
  .tx-mark{
    width:4px;
    align-self:stretch;
    flex:none;
    border-radius:2px;
  }
  .tx-mark.income{ background:var(--income); }
  .tx-mark.expense{ background:var(--expense); }

  .tx-main{
    flex:1;
    min-width:0;
  }
  .tx-text{
    font-size:0.92rem;
    margin:0 0 2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .tx-date{
    font-size:0.75rem;
    color:var(--ink-soft);
  }
  .tx-amount{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.95rem;
    flex:none;
    min-width:110px;
    text-align:right;
  }
  .tx-amount.income{ color:var(--income); }
  .tx-amount.expense{ color:var(--expense); }

  .tx-delete{
    flex:none;
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:1rem;
    cursor:pointer;
    padding:4px 6px;
    line-height:1;
  }
  .tx-delete:hover{ color:var(--expense); }

  .empty-state{
    padding:28px 0;
    color:var(--ink-soft);
    font-size:0.9rem;
    text-align:center;
  }

  @media (max-width:480px){
    .vault-stats{ gap:18px; flex-wrap:wrap; }
    .tx-amount{ min-width:80px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M13 2L23 6V12C23 18 19 22.5 13 24C7 22.5 3 18 3 12V6L13 2Z" stroke="#16231D" stroke-width="1.6" fill="#B8892B" fill-opacity="0.15"/>
      <path d="M9 13L11.5 15.5L17 10" stroke="#16231D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>CoinGuard</h1>
  </div>

  <div class="vault">
    <p class="label">Загальний баланс</p>
    <p class="balance" id="balanceDisplay">₴ 0</p>

    <div class="vault-stats">
      <div>
        <span class="stat-label">Доходи</span>
        <span class="stat-value income" id="incomeDisplay">₴ 0</span>
      </div>
      <div>
        <span class="stat-label">Витрати</span>
        <span class="stat-value expense" id="expenseDisplay">₴ 0</span>
      </div>
    </div>

    <button class="convert-btn" id="convertBtn">Конвертувати баланс</button>
    <div class="convert-result" id="convertResult"></div>
  </div>

  <p class="section-title">Нова операція</p>
  <form class="entry-form" id="txForm">
    <div class="field field-text">
      <label for="txText">Назва</label>
      <input type="text" id="txText" placeholder="Наприклад, купівля продуктів">
    </div>
    <div class="field field-amount">
      <label for="txAmount">Сума</label>
      <input type="number" id="txAmount" placeholder="0" step="0.01">
    </div>
    <div class="field field-type">
      <label for="txType">Тип</label>
      <select id="txType">
        <option value="expense">Витрата</option>
        <option value="income">Дохід</option>
      </select>
    </div>
    <button type="submit" class="add-btn">Додати</button>
  </form>
  <div class="form-error" id="formError"></div>

  <p class="section-title">Історія операцій</p>
  <div class="tx-list" id="txList"></div>

</div>

<script>
  const STORAGE_KEY = 'coinguard_transactions';

  const balanceDisplay = document.getElementById('balanceDisplay');
  const incomeDisplay = document.getElementById('incomeDisplay');
  const expenseDisplay = document.getElementById('expenseDisplay');
  const txForm = document.getElementById('txForm');
  const txTextInput = document.getElementById('txText');
  const txAmountInput = document.getElementById('txAmount');
  const txTypeSelect = document.getElementById('txType');
  const formError = document.getElementById('formError');
  const txListEl = document.getElementById('txList');
  const convertBtn = document.getElementById('convertBtn');
  const convertResult = document.getElementById('convertResult');

  // ---------- Стан ----------
  let transactions = loadTransactions();

  // ---------- LocalStorage ----------
  function loadTransactions() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      console.error('Не вдалося прочитати localStorage:', err);
      return [];
    }
  }

  function saveTransactions() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
  }

  // ---------- Форматування ----------
  function formatMoney(value) {
    return '₴ ' + value.toLocaleString('uk-UA', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }

  function formatDate(isoDate) {
    const d = new Date(isoDate);
    return d.toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  // ---------- Розрахунки (reduce) ----------
  function calculateStats() {
    const totals = transactions.reduce((acc, tx) => {
      if (tx.type === 'income') {
        acc.income += tx.amount;
      } else {
        acc.expense += tx.amount;
      }
      return acc;
    }, { income: 0, expense: 0 });

    return {
      income: totals.income,
      expense: totals.expense,
      balance: totals.income - totals.expense
    };
  }

  // ---------- Рендер ----------
  function render() {
    const stats = calculateStats();

    balanceDisplay.textContent = formatMoney(stats.balance);
    incomeDisplay.textContent = formatMoney(stats.income);
    expenseDisplay.textContent = formatMoney(stats.expense);

    renderList();
  }

  function renderList() {
    txListEl.innerHTML = '';

    if (transactions.length === 0) {
      txListEl.innerHTML = '<div class="empty-state">Ще немає жодної операції — додайте першу вище.</div>';
      return;
    }

    // сортуємо від найновіших до найстаріших
    const sorted = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));

    sorted
      .map(tx => createTxRow(tx))
      .forEach(row => txListEl.appendChild(row));
  }

  function createTxRow(tx) {
    const row = document.createElement('div');
    row.className = 'tx-row';

    const sign = tx.type === 'income' ? '+' : '−';

    row.innerHTML = `
      <div class="tx-mark ${tx.type}"></div>
      <div class="tx-main">
        <p class="tx-text">${escapeHtml(tx.text)}</p>
        <span class="tx-date">${formatDate(tx.date)}</span>
      </div>
      <div class="tx-amount ${tx.type}">${sign} ${formatMoney(tx.amount)}</div>
      <button class="tx-delete" data-id="${tx.id}" aria-label="Видалити операцію">✕</button>
    `;

    row.querySelector('.tx-delete').addEventListener('click', () => deleteTransaction(tx.id));
    return row;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Додавання транзакції ----------
  txForm.addEventListener('submit', (e) => {
    e.preventDefault();
    formError.textContent = '';

    const text = txTextInput.value.trim();
    const amount = parseFloat(txAmountInput.value);
    const type = txTypeSelect.value;

    if (!text) {
      formError.textContent = 'Введіть назву операції.';
      return;
    }
    if (isNaN(amount) || amount <= 0) {
      formError.textContent = 'Сума має бути більшою за нуль.';
      return;
    }

    const newTx = {
      id: 'trx-' + Date.now(),
      text,
      amount,
      type,
      date: new Date().toISOString().slice(0, 10)
    };

    transactions.push(newTx);
    saveTransactions();
    render();

    txForm.reset();
    txTypeSelect.value = 'expense';
    txTextInput.focus();
  });

  // ---------- Видалення транзакції ----------
  function deleteTransaction(id) {
    transactions = transactions.filter(tx => tx.id !== id);
    saveTransactions();
    render();
  }

  // ---------- Конвертація валют (Fetch API) ----------
  convertBtn.addEventListener('click', async () => {
    convertBtn.disabled = true;
    convertResult.classList.remove('error');
    convertResult.textContent = 'Отримання курсу...';

    try {
      const response = await fetch('https://api.exchangerate-api.com/v4/latest/UAH');

      if (!response.ok) {
        throw new Error('Server error');
      }

      const data = await response.json();
      const stats = calculateStats();

      const usd = stats.balance * data.rates.USD;
      const eur = stats.balance * data.rates.EUR;

      convertResult.textContent =
        `≈ $${usd.toFixed(2)} USD   /   €${eur.toFixed(2)} EUR`;
    } catch (err) {
      convertResult.classList.add('error');
      convertResult.textContent = 'Помилка завантаження курсу валют.';
    } finally {
      convertBtn.disabled = false;
    }
  });

  // ---------- Старт ----------
  render();
</script>

</body>
</html>
